on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches: ["develop"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: true
  #ci-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup GitHub Pages
      id: pages
      uses: actions/configure-pages@v1
      
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 6

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 16.x
        cache: 'pnpm'
        
    - name: Make sure webpack cache dir exists
      run: |
        mkdir -p ".webpack/cache1-babel"
        mkdir -p ".webpack/cache2-postcss"
        mkdir -p ".webpack/cache3-hard-source"

    - name: Cache webpack build
      uses: actions/cache@v3
      with:
        path: |
            .webpack/cache1-babel
            .webpack/cache2-postcss
            .webpack/cache3-hard-source
        key: ${{ runner.os }}-webpack-${{ hashFiles('**/webpack.config.js') }}-${{ hashFiles('package.json') }}
        restore-keys: |
          ${{ runner.os }}-webpack-

    - name: Install dependencies and build site
      run: |
        #npm i -g pnpm@v6
        pnpm install --shamefully-hoist
        #NODE_ENV="production"
        webpack --bail --cache

    - name: Upload artifact 
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./build/

  deploy:
    environment:
      name: github-pages
      url: 'https://penguinmod.com/project'
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
